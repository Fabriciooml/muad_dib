services:
  migrate:
    image: ${TRACKER_IMAGE:?set TRACKER_IMAGE}
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    networks:
      - postgres
    restart: "no"

  tracker:
    image: ${TRACKER_IMAGE:?set TRACKER_IMAGE}
    command: ["uvicorn", "cinema_tracker.app:create_application", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?set KAFKA_BOOTSTRAP_SERVERS}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
    networks:
      - postgres
    ports:
      - "${TRACKER_BIND_ADDR:-127.0.0.1}:${TRACKER_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  postgres:
    external: true
    name: ${POSTGRES_NETWORK:?set POSTGRES_NETWORK}
